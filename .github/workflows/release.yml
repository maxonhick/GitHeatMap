name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write

jobs:
  build:
    name: Build static binary for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: GitHeatMap
            asset_name: git-heatmap-linux-x86_64
          - os: windows-latest
            artifact_name: GitHeatMap.exe
            asset_name: git-heatmap-windows-x86_64
          - os: macos-latest
            artifact_name: GitHeatMap
            asset_name: git-heatmap-macos-universal

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja

      - name: Configure CMake
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTS=OFF
          ${{ runner.os == 'macOS' && '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"' || '' }}

      - name: Build
        run: cmake --build build --config Release

      - name: Create archive
        shell: bash
        run: |
          mkdir -p dist
          cp "build/${{ matrix.artifact_name }}" dist/
          tar -czf "${{ matrix.asset_name }}.tar.gz" -C dist .

      - name: Upload archive to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}.tar.gz
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
