name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    name: Build and archive for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: GitHeatMap
            asset_name: git-heatmap-linux-x86_64
          - os: windows-latest
            artifact_name: GitHeatMap.exe
            asset_name: git-heatmap-windows-x86_64
          - os: macos-latest
            artifact_name: GitHeatMap
            asset_name: git-heatmap-macos-universal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgit2-dev pkg-config ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install libgit2 pkg-config ninja

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ninja
          git clone https://github.com/Microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg install libgit2:x64-windows
          echo "VCPKG_ROOT=$env:GITHUB_WORKSPACE/vcpkg" >> $env:GITHUB_ENV
        shell: pwsh

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -B build -G Ninja -DCMAKE_CXX_STANDARD=17
        shell: bash

      - name: Configure CMake (Windows)
        if: runner.os == 'Windows'
        run: |
          cmake -B build -G Ninja `
            -DCMAKE_CXX_STANDARD=17 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
        shell: pwsh

      - name: Build
        run: cmake --build build --config Release

      # Creating an archive with a binary file
      - name: Create archive
        shell: bash
        run: |
          BINARY_PATH="${{ github.workspace }}/build"
          if [ ! -f "$BINARY_PATH/${{ matrix.artifact_name }}" ]; then
            echo "Ошибка: Файл ${{ matrix.artifact_name }} не найден в $BINARY_PATH"
            echo "Содержимое директории:"
            ls -la "$BINARY_PATH" || true
            exit 1
          fi
          mkdir -p ${{ github.workspace }}/dist
          cp "$BINARY_PATH/${{ matrix.artifact_name }}" ${{ github.workspace }}/dist/
          cd ${{ github.workspace }}
          tar -czf ${{ matrix.asset_name }}.tar.gz -C dist .

      - name: Upload archive to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}.tar.gz
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
