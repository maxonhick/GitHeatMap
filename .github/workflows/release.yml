name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build:
    name: Build and archive for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: GitHeatMap
            asset_name: git-heatmap-linux-x86_64
          - os: windows-latest
            artifact_name: GitHeatMap.exe
            asset_name: git-heatmap-windows-x86_64
          - os: macos-latest
            artifact_name: GitHeatMap
            asset_name: git-heatmap-macos-universal
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Installing libgit2 on Linux
      - name: Install libgit2 (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgit2-dev

      # Installing libgit2 on macOS
      - name: Install libgit2 (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libgit2
          echo "LIBGIT2_ROOT=$(brew --prefix libgit2)" >> $GITHUB_ENV

      # Installing libgit2 on Windows using vcpkg
      - name: Install vcpkg and libgit2 (Windows)
        if: runner.os == 'Windows'
        run: |
          git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
          cd C:\vcpkg
          .\bootstrap-vcpkg.bat
          .\vcpkg.exe install libgit2:x64-windows
        shell: pwsh

      - name: Configure CMake
        uses: threeal/cmake-action@v1.3.0
        with:
          source-dir: ${{ github.workspace }}
          build-dir: ${{ github.workspace }}/build
          options: >
            CMAKE_CXX_STANDARD=17
            CMAKE_BUILD_TYPE=Release
            ${{ runner.os == 'Windows' && 'CMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake' || '' }}
            ${{ runner.os == 'macOS' && format('LIBGIT2_ROOT={0}', env.LIBGIT2_ROOT) || '' }}

      - name: Build the project
        run: cmake --build ${{ github.workspace }}/build --config Release

      # Creating an archive with a binary file
      - name: Create archive
        shell: bash
        run: |
          BINARY_PATH="${{ github.workspace }}/build"
          if [ "${{ runner.os }}" == "Windows" ]; then
            BINARY_PATH="$BINARY_PATH/Release"
          fi
          if [ ! -f "$BINARY_PATH/${{ matrix.artifact_name }}" ]; then
            echo "Ошибка: Файл ${{ matrix.artifact_name }} не найден в $BINARY_PATH"
            echo "Содержимое директории:"
            ls -la "$BINARY_PATH" || true
            exit 1
          fi
          mkdir -p ${{ github.workspace }}/dist
          cp "$BINARY_PATH/${{ matrix.artifact_name }}" ${{ github.workspace }}/dist/
          cd ${{ github.workspace }}
          tar -czf ${{ matrix.asset_name }}.tar.gz -C dist .

      - name: Upload archive to release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}.tar.gz
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: true
